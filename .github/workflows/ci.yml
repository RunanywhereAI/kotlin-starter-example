name: CI

# What this gate proves: a clean clone of THIS repo — with no monorepo checkout
# and no local AARs — resolves the RunAnywhere Kotlin SDK and its backend engines
# from Maven Central (group io.github.sanchitmonga22) and assembles a debug APK.
#
# STATUS: green. All four SDK artifacts are live on Maven Central at 0.20.15 —
# runanywhere-sdk, runanywhere-llamacpp, runanywhere-onnx and (as of
# 2026-08-11) runanywhere-qhexrt-android, which was the last one in flight.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Two JDKs on purpose:
      #   * 17 — what the app compiles against (compileOptions source/target 17)
      #     and the JDK named in README requirements. Listed last, so JAVA_HOME
      #     points at it.
      #   * 21 — what the Gradle *daemon* itself needs. gradle/gradle-daemon-jvm.properties
      #     pins `toolchainVersion=21`; without a local 21 Gradle would auto-provision
      #     one over the network on every run.
      - name: Set up JDKs (17 for the build, 21 for the Gradle daemon)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      # compileSdk/targetSdk are 37 with minorApiLevel 0, which sdkmanager names
      # `platforms;android-37.0`. Install it explicitly instead of relying on
      # AGP's implicit download.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle (with dependency + build caching)
        uses: gradle/actions/setup-gradle@v6

      # ----------------------------------------------------------------------
      # Two repo-side reproducibility gates are bypassed here ON PURPOSE. Both
      # are STALE: they were generated back when the SDK was consumed as local,
      # POM-less AARs, so neither one contains a single io.github.sanchitmonga22
      # entry, and both hard-fail the moment Gradle resolves the SDK from Maven
      # Central. Neither can be regenerated today, because regenerating them
      # requires resolving the full dependency graph — including the still
      # unpublished runanywhere-qhexrt-android artifact.
      #
      #   1. --dependency-verification=off
      #      gradle/verification-metadata.xml (3911 lines, 0 SDK components)
      #      would otherwise fail every SDK artifact with
      #      "not in dependency verification metadata".
      #
      #   2. env -u CI
      #      app/build.gradle.kts flips dependency locking to LockMode.STRICT
      #      whenever $CI is set. app/gradle.lockfile (374 lines, 0 SDK entries)
      #      would then fail with "resolved ... which is not part of the lock
      #      state". Unsetting CI for this one command restores LockMode.LENIENT.
      #      (There is no -P override: the build script ORs the CI check ahead of
      #      the runanywhere.strictLocks property.)
      #
      # TO RETIRE BOTH BYPASSES (now unblocked — the full graph resolves since
      # runanywhere-qhexrt-android:0.20.15 landed):
      #      ./gradlew :app:dependencies --write-locks
      #      ./gradlew --write-verification-metadata sha256 :app:assembleDebug
      #   commit the refreshed gradle/verification-metadata.xml +
      #   app/gradle.lockfile, then delete `env -u CI` and
      #   `--dependency-verification=off` from the line below so CI enforces both
      #   gates again (that is what scripts/verify.sh does locally).
      #   Generate the verification metadata on Linux (or on Linux *and* macOS):
      #   OS-classified artifacts such as com.android.tools.build:aapt2:…:linux
      #   vs :osx differ per host, and Mac-only metadata fails this runner.
      # ----------------------------------------------------------------------
      - name: Assemble debug APK
        run: >
          env -u CI ./gradlew :app:assembleDebug
          --dependency-verification=off
          --no-daemon
          --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
